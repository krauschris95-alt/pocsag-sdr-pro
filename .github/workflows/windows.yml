name: Windows x64
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          archives: qtbase qttools
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy
        run: |
          cmake --install build --config Release --prefix dist/POCSAG-SDR-Pro
          windeployqt --release --no-translations dist/POCSAG-SDR-Pro/POCSAG-SDR-Pro.exe
          python -m pip install backports.zstd
          ./scripts/package.ps1
          python scripts/package_hackrf.py dist/POCSAG-SDR-Pro hackrf-cache
          Copy-Item "$env:IQTA_TOOLS/mingw1310_64/licenses" dist/POCSAG-SDR-Pro/licenses/MinGW -Recurse
          python scripts/build_sdr_modules.py
          python scripts/build_installer.py build-sdr-deps/nsis-source/nsis-3.12/makensis.exe 0.1.6
          Compress-Archive dist/POCSAG-SDR-Pro/* dist/POCSAG-SDR-Pro-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: POCSAG-SDR-Pro-windows-x64
          path: |
            dist/POCSAG-SDR-Pro-windows-x64.zip
            dist/*-setup.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: POCSAG-SDR-Pro-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/RELEASE-0.1.6.md
          files: |
            POCSAG-SDR-Pro-windows-x64.zip
            *-setup.exe
