name: Windows x64
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: packaging_python
        with:
          python-version: '3.14'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          archives: qtbase qttools
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cmake --install build --config Release --prefix dist/POCSAG-SDR-Pro
          windeployqt --release --no-translations dist/POCSAG-SDR-Pro/POCSAG-SDR-Pro.exe
          $packagePython='${{ steps.packaging_python.outputs.python-path }}'
          & $packagePython --version
          & $packagePython -c "from compression import zstd; print('Standard-library Zstandard available')"
          ./scripts/package.ps1
          & $packagePython scripts/package_hackrf.py dist/POCSAG-SDR-Pro hackrf-cache
          Copy-Item "$env:IQTA_TOOLS/mingw1310_64/licenses" dist/POCSAG-SDR-Pro/licenses/MinGW -Recurse
          & $packagePython scripts/build_sdr_modules.py
          & $packagePython scripts/build_airspy.py
          & $packagePython scripts/build_installer.py build-sdr-deps/nsis-source/nsis-3.12/makensis.exe 0.1.19
          Compress-Archive dist/POCSAG-SDR-Pro/* dist/POCSAG-SDR-Pro-windows-x64.zip
          Get-ChildItem dist/*.zip,dist/*-setup.exe | ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: POCSAG-SDR-Pro-windows-x64
          path: |
            dist/POCSAG-SDR-Pro-windows-x64.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve already qualified release assets
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq "any(.[]; .tagName == \"$GITHUB_REF_NAME\")")"
          if [ "$existing" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release_check.outputs.publish == 'true'
        with:
          name: POCSAG-SDR-Pro-windows-x64
      - uses: softprops/action-gh-release@v2
        if: steps.release_check.outputs.publish == 'true'
        with:
          prerelease: true
          body_path: docs/RELEASE-0.1.19.md
          files: |
            POCSAG-SDR-Pro-windows-x64.zip
            *-setup.exe
            SHA256SUMS.txt
