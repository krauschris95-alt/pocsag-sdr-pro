name: Windows x64
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy
        run: |
          cmake --install build --config Release --prefix dist/POCSAG-SDR-Pro
          windeployqt --release --no-translations dist/POCSAG-SDR-Pro/POCSAG-SDR-Pro.exe
          ./scripts/package.ps1
          Compress-Archive dist/POCSAG-SDR-Pro/* dist/POCSAG-SDR-Pro-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: POCSAG-SDR-Pro-windows-x64
          path: dist/POCSAG-SDR-Pro-windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: POCSAG-SDR-Pro-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: POCSAG-SDR-Pro-windows-x64.zip
